[project]
name = "break-investigator-kb"
version = "0.1.0"
description = "Knowledge base for the Break Investigator: synthetic runbooks chunked, embedded and stored in Postgres + pgvector"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.5",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1",
]

[project.scripts]
kb-ingest = "break_investigator_kb.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/break_investigator_kb"]
